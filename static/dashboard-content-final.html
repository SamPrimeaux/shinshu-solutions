<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Pages — Shinshu Solutions</title>
<link rel="stylesheet" href="/dash-style.css">
<style>
/* ── Editor overrides — zero padding main, full height ─────── */
body { overflow: hidden; }
main {
    padding: 0 !important;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 64px);
    overflow: hidden;
}

/* ── Editor topbar ─────────────────────────────────────────── */
#editor-bar {
    height: 52px;
    background: var(--glass-topbar-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border-bottom: 1px solid var(--glass-topbar-border);
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    flex-shrink: 0; z-index: 50;
}
#editor-bar-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
#editor-bar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.page-select {
    height: 34px; padding: 0 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px;
    color: var(--text-main); cursor: pointer; outline: none;
    min-width: 220px;
    transition: border-color .15s;
}
.page-select:focus { border-color: var(--primary); }

#status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 12px; color: var(--text-muted);
    white-space: nowrap;
    transition: all .2s;
}
.sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background .3s; }
.sdot.saved  { background: var(--success); }
.sdot.dirty  { background: var(--warning); }
.sdot.saving { background: var(--primary); animation: blink .7s infinite; }
.sdot.idle   { background: var(--text-muted); }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

.ebtn {
    height: 34px; padding: 0 14px;
    border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; border: none; transition: all .15s;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
}
.ebtn:active { transform: scale(.97); }
.ebtn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.ebtn-ghost {
    background: transparent; color: var(--text-main);
    border: 1px solid var(--border);
}
.ebtn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }
.ebtn-primary { background: var(--primary); color: #fff; }
.ebtn-primary:hover:not(:disabled) { background: var(--primary-dark); }

/* ── 3-col split ──────────────────────────────────────────── */
#editor-body { flex: 1; display: flex; overflow: hidden; }

/* ── Left: fields panel ───────────────────────────────────── */
#fields-panel {
    width: 272px; min-width: 272px;
    display: flex; flex-direction: column;
    background: var(--bg-card);
    border-right: 1px solid var(--border);
    overflow: hidden;
}
.panel-title {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
}
.panel-icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); font-size: 15px; padding: 2px 5px;
    border-radius: 5px; line-height: 1; transition: color .15s;
}
.panel-icon-btn:hover { color: var(--primary); }

#fields-body {
    flex: 1; overflow-y: auto;
    padding: 8px;
}
#fields-body::-webkit-scrollbar { width: 3px; }
#fields-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Field group */
.fg {
    background: var(--bg-main);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 7px; overflow: hidden;
}
.fg-hdr {
    padding: 8px 11px;
    background: rgba(255,140,66,.07);
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-muted);
    cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between;
    transition: background .15s;
}
.fg-hdr:hover { background: var(--primary-dim); color: var(--text-main); }
.fg-arr { font-size: 9px; transition: transform .2s; }
.fg.open .fg-arr { transform: rotate(0deg); }
.fg.closed .fg-arr { transform: rotate(-90deg); }
.fg.closed .fg-body { display: none; }
.fg-body { padding: 8px; display: flex; flex-direction: column; gap: 7px; }

/* Field items */
.fi { display: flex; flex-direction: column; gap: 3px; }
.fi-label { font-size: 11px; font-weight: 500; color: var(--text-muted); padding: 0 2px; }
.fi-input, .fi-area {
    width: 100%; padding: 7px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px; font-family: inherit;
    font-size: 13px; color: var(--text-main);
    outline: none; transition: border-color .15s, box-shadow .15s;
    resize: vertical;
}
.fi-input:focus, .fi-area:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-dim);
}
.fi-area { min-height: 66px; }
.fi-key {
    font-size: 10px; color: var(--text-muted);
    font-family: 'Menlo', monospace; padding: 0 2px;
    opacity: .7;
}
.fi-img-preview {
    width: 100%; max-height: 90px; object-fit: cover;
    border-radius: 7px; border: 1px solid var(--border);
    margin-top: 4px; display: block;
}

/* Meta section */
#meta-panel {
    padding: 10px 8px;
    border-top: 1px solid var(--border);
    background: rgba(255,140,66,.04);
    display: flex; flex-direction: column; gap: 7px;
    flex-shrink: 0;
}

/* Empty / no page state */
#fields-empty {
    padding: 40px 20px; text-align: center;
    color: var(--text-muted); font-size: 13px; line-height: 1.7;
}
#fields-empty strong { display: block; font-size: 15px; color: var(--text-main); margin-bottom: 8px; }

/* ── Center: preview canvas ───────────────────────────────── */
#preview-panel {
    flex: 1; display: flex; flex-direction: column;
    background: #D4CFC9; overflow: hidden;
}
#preview-bar {
    height: 40px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    flex-shrink: 0;
}
#preview-url {
    flex: 1; font-size: 12px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.vbtn {
    height: 26px; padding: 0 10px;
    border-radius: 6px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--border); background: var(--bg-main);
    color: var(--text-muted); cursor: pointer; transition: .15s;
}
.vbtn.on { background: var(--primary-dim); border-color: var(--primary); color: var(--primary); }
.vbtn:hover:not(.on) { border-color: var(--primary); color: var(--primary); }

#preview-wrap {
    flex: 1; display: flex;
    justify-content: center; align-items: flex-start;
    padding: 20px; overflow: auto;
}
#preview-frame {
    background: white; border: none;
    border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.2);
    width: 100%; height: calc(100vh - 64px - 52px - 40px - 40px);
    transition: max-width .3s ease;
    max-width: 1100px;
}
#preview-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; color: var(--text-muted); text-align: center;
    padding: 40px;
}
#preview-empty strong { font-size: 18px; font-weight: 600; color: var(--text-main); display: block; }

/* ── Right: nav pages ─────────────────────────────────────── */
#nav-panel {
    width: 200px; min-width: 200px;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
}
#nav-list { flex: 1; overflow-y: auto; }
.np-row {
    padding: 10px 13px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    cursor: pointer; transition: background .12s; font-size: 13px;
}
.np-row:hover { background: var(--primary-dim); }
.np-row.curr { background: var(--primary-dim); }
.np-name { color: var(--text-main); font-weight: 500; }
.np-vis {
    font-size: 10px; padding: 2px 7px; border-radius: 10px;
    background: var(--bg-main); color: var(--text-muted);
    border: 1px solid var(--border); white-space: nowrap; flex-shrink: 0;
}
.np-vis.on { background: var(--primary-dim); color: var(--primary); border-color: rgba(255,140,66,.3); }
#nav-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
}
#nav-footer a {
    text-align: center; font-size: 12px; color: var(--primary);
    text-decoration: none; padding: 4px;
    font-weight: 500;
}
#nav-footer a:hover { text-decoration: underline; }

/* ── Agent Sam strip ──────────────────────────────────────── */
#agent-strip {
    height: 46px;
    background: var(--glass-sidebar-bg);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    border-top: 1px solid var(--glass-sidebar-border);
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    flex-shrink: 0; z-index: 50;
}
#agent-label {
    font-size: 12px; font-weight: 600;
    color: var(--glass-text); white-space: nowrap; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
}
#mcp-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted); flex-shrink: 0;
    transition: background .3s;
}
#mcp-dot.live { background: var(--success); }
#agent-input {
    flex: 1; height: 30px; padding: 0 12px;
    background: rgba(255,255,255,.25);
    border: 1px solid rgba(255,140,66,.3);
    border-radius: 20px; font-family: inherit;
    font-size: 13px; color: var(--glass-text); outline: none;
    transition: border-color .15s;
}
#agent-input::placeholder { color: var(--glass-muted); }
#agent-input:focus { border-color: var(--primary); background: rgba(255,255,255,.35); }
#agent-reply {
    font-size: 12px; color: var(--glass-muted); max-width: 320px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex-shrink: 0;
}
.send-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity .15s;
}
.send-btn:hover { opacity: .85; }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.send-btn svg { width: 14px; height: 14px; fill: white; }

/* ── Toast ─────────────────────────────────────────────────── */
#toast {
    position: fixed; bottom: 55px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    padding: 9px 20px; border-radius: 9px;
    font-size: 13px; font-weight: 500; color: #fff;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 9000; white-space: nowrap;
    background: var(--text-main);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok  { background: var(--success); }
#toast.err { background: var(--error); }

/* ── Loading screen ───────────────────────────────────────── */
#loading-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg-main);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    transition: opacity .3s;
}
#loading-screen.out { opacity: 0; pointer-events: none; }
.spin {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-screen p { font-size: 14px; color: var(--text-muted); }

/* ── Mobile hide ──────────────────────────────────────────── */
@media (max-width: 768px) {
    #nav-panel { display: none; }
    #fields-panel { width: 240px; min-width: 240px; }
}
</style>
</head>
<body class="has-dash-header editor-page">

<!-- Loading -->
<div id="loading-screen">
    <div class="spin"></div>
    <p>Loading content editor...</p>
</div>

<!-- Injected by dash-header.js & dash-sidebar.js -->

<main>

    <!-- Editor topbar -->
    <div id="editor-bar">
        <div id="editor-bar-left">
            <select id="page-select" class="page-select" onchange="loadPage(this.value)">
                <option value="">Select a page...</option>
            </select>
            <div id="status-pill">
                <div class="sdot idle" id="sdot"></div>
                <span id="status-txt">Select a page</span>
            </div>
        </div>
        <div id="editor-bar-right">
            <button class="ebtn ebtn-ghost" onclick="viewLive()" title="Open live page">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                View live
            </button>
            <button class="ebtn ebtn-ghost" id="discard-btn" onclick="discard()" disabled>Discard</button>
            <button class="ebtn ebtn-primary" id="save-btn" onclick="save()" disabled>Save changes</button>
        </div>
    </div>

    <!-- 3-column body -->
    <div id="editor-body">

        <!-- Fields panel -->
        <div id="fields-panel">
            <div class="panel-title">
                <span>Content Fields</span>
                <button class="panel-icon-btn" onclick="collapseAll()" title="Collapse all">▾</button>
            </div>
            <div id="fields-body">
                <div id="fields-empty">
                    <strong>No page selected</strong>
                    Choose a page from the dropdown above to edit its content fields
                </div>
            </div>
            <div id="meta-panel" style="display:none">
                <div class="fi-label" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:4px">Page SEO</div>
                <div class="fi">
                    <div class="fi-label">Page title</div>
                    <input type="text" class="fi-input" id="meta-title" placeholder="Page title for search engines" oninput="dirty()">
                </div>
                <div class="fi">
                    <div class="fi-label">Meta description</div>
                    <textarea class="fi-area" id="meta-desc" style="min-height:48px" placeholder="Brief description for search engines" oninput="dirty()"></textarea>
                </div>
            </div>
        </div>

        <!-- Preview canvas -->
        <div id="preview-panel">
            <div id="preview-bar">
                <span id="preview-url">No page selected</span>
                <button class="vbtn on" onclick="vp('desktop',this)">Desktop</button>
                <button class="vbtn" onclick="vp('tablet',this)">Tablet</button>
                <button class="vbtn" onclick="vp('mobile',this)">Mobile</button>
                <button class="ebtn ebtn-ghost" style="height:26px;padding:0 10px;font-size:11px" onclick="reload()">↺ Reload</button>
            </div>
            <div id="preview-wrap">
                <div id="preview-empty">
                    <strong>Live Preview</strong>
                    Select a page to preview its content
                </div>
                <iframe id="preview-frame" style="display:none"></iframe>
            </div>
        </div>

        <!-- Nav pages panel -->
        <div id="nav-panel">
            <div class="panel-title">Site Navigation</div>
            <div id="nav-list"></div>
            <div id="nav-footer">
                <button class="ebtn ebtn-ghost" style="width:100%;font-size:12px;height:30px" onclick="scanPages()">Scan for new pages</button>
                <a href="/dashboard-agent">↗ Ask Agent Sam to edit</a>
            </div>
        </div>

    </div>

    <!-- Agent Sam strip -->
    <div id="agent-strip">
        <div id="agent-label">
            <div id="mcp-dot"></div>
            Agent Sam
        </div>
        <input type="text" id="agent-input" placeholder="Ask Agent Sam to edit this page..." onkeydown="if(event.key==='Enter')agentSend()">
        <span id="agent-reply"></span>
        <button class="send-btn" id="agent-send-btn" onclick="agentSend()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

</main>

<div id="toast"></div>

<!-- Shell scripts — auto-inject header + sidebar -->
<script src="/dash-theme.js"></script>
<script src="/dash-sidebar.js"></script>
<script src="/dash-header.js"></script>

<script>
// ── Config ─────────────────────────────────────────────────────
const SITE = 'https://shinshusolutions.com';
const API  = window.location.origin;

// ── State ──────────────────────────────────────────────────────
let pages    = [];
let curr     = null;   // current page object
let schema   = [];
let vals     = {};
let orig     = {};
let isDirty  = false;
let rlTimer  = null;
let agentCtx = [];

// ── Boot ───────────────────────────────────────────────────────
(async () => {
    try {
        const auth = await apiFetch('/api/auth/check');
        if (!auth?.success) { window.location.href = '/login'; return; }
    } catch { window.location.href = '/login'; return; }

    await Promise.all([fetchPages(), pingMcp()]);
    renderNav();
    fadeOut('loading-screen');
})();

async function fetchPages() {
    try {
        const d = await apiFetch('/api/site/pages');
        pages = (d.pages ?? []).filter(p => {
            const fn = p.id || p.file_name || '';
            return !fn.startsWith('dashboard');
        });
        const sel = document.getElementById('page-select');
        sel.innerHTML = '<option value="">Select a page...</option>' +
            pages.map(p => {
                const id  = p.id || p.file_name;
                const lbl = p.name || p.display_name || id;
                const pth = p.path || '/';
                return `<option value="${id}">${lbl} (${pth})</option>`;
            }).join('');
    } catch(e) { toast('Failed to load pages', 'err'); }
}

async function pingMcp() {
    try {
        const r = await fetch('https://mcp.shinshusolutions.com/health');
        const d = await r.json();
        if (d.status === 'ok') {
            document.getElementById('mcp-dot').classList.add('live');
            document.getElementById('agent-label').title = `MCP live · ${d.tools} tools`;
        }
    } catch {}
}

// ── Load page ──────────────────────────────────────────────────
async function loadPage(id) {
    if (!id) { resetEditor(); return; }
    curr = pages.find(p => (p.id || p.file_name) === id) || { file_name: id, path: '/' };

    // Preview
    const path = curr.path === '/' ? '' : (curr.path || '');
    const previewUrl = `${SITE}${path}`;
    document.getElementById('preview-url').textContent = previewUrl;
    document.getElementById('preview-empty').style.display = 'none';
    const frame = document.getElementById('preview-frame');
    frame.style.display = 'block';
    frame.src = previewUrl;

    // Schema + values
    setStatus('saving', 'Loading...');
    try {
        const slug = curr.path === '/'
            ? 'home'
            : (curr.path || '').replace(/^\//, '') || (curr.file_name || '').replace('.html', '');
        const d = await apiFetch(`/api/site/page?slug=${slug}`);
        schema = d.schema ?? [];
        vals   = { ...(d.values ?? {}) };
        orig   = { ...vals };
        isDirty = false;

        document.getElementById('meta-title').value = vals._meta_title || curr.display_name || curr.name || '';
        document.getElementById('meta-desc').value  = vals._meta_description || '';
        document.getElementById('meta-panel').style.display = 'flex';

        renderFields();
        setStatus('saved', 'All changes saved');
        document.getElementById('save-btn').disabled    = true;
        document.getElementById('discard-btn').disabled = true;
        renderNav(); // re-render to show active
    } catch(e) {
        setStatus('idle', 'Failed to load');
        toast('Failed to load page content', 'err');
    }
}

function resetEditor() {
    curr = null; schema = []; vals = {}; orig = {}; isDirty = false;
    document.getElementById('fields-body').innerHTML = `
        <div id="fields-empty">
            <strong>No page selected</strong>
            Choose a page from the dropdown above
        </div>`;
    document.getElementById('meta-panel').style.display = 'none';
    document.getElementById('preview-empty').style.display = 'flex';
    document.getElementById('preview-frame').style.display = 'none';
    document.getElementById('preview-url').textContent = 'No page selected';
    setStatus('idle', 'Select a page');
    document.getElementById('save-btn').disabled    = true;
    document.getElementById('discard-btn').disabled = true;
}

// ── Render fields ──────────────────────────────────────────────
function renderFields() {
    const body = document.getElementById('fields-body');
    body.innerHTML = '';

    if (!schema.length) {
        body.innerHTML = `
            <div style="padding:20px;text-align:center;font-size:13px;color:var(--text-muted);line-height:1.7">
                No editable fields detected.<br>
                <span style="font-size:11px">Add <code style="background:var(--bg-main);padding:1px 5px;border-radius:4px">data-editable="key"</code> to page HTML.</span>
            </div>`;
        return;
    }

    // Group fields by prefix
    const groups = {};
    schema.forEach(f => {
        const grp = f.id.includes('_') ? ucfirst(f.id.split('_')[0]) : 'General';
        if (!groups[grp]) groups[grp] = [];
        groups[grp].push(f);
    });

    Object.entries(groups).forEach(([grp, fields], gi) => {
        const div = document.createElement('div');
        div.className = 'fg open';
        div.innerHTML = `
            <div class="fg-hdr" onclick="toggleFg(this.parentElement)">
                <span>${grp}</span>
                <span class="fg-arr">▾</span>
            </div>
            <div class="fg-body">
                ${fields.map(f => {
                    const v = vals[f.id] ?? '';
                    const isImg  = f.type === 'image';
                    const isLong = !isImg && (f.type === 'textarea' || String(v).length > 80 || String(v).includes('\n'));
                    return `
                    <div class="fi">
                        <div class="fi-label">${f.label || ucfirst(f.id)}</div>
                        ${isImg
                            ? `<input class="fi-input" type="text" data-k="${f.id}" value="${xa(v)}" placeholder="Image URL" oninput="fieldChange(this)">
                               <img class="fi-img-preview" src="${xa(v)}" onerror="this.style.display='none'" style="${v?'':'display:none'}">`
                            : isLong
                                ? `<textarea class="fi-area" data-k="${f.id}" oninput="fieldChange(this)">${xh(v)}</textarea>`
                                : `<input class="fi-input" type="text" data-k="${f.id}" value="${xa(v)}" oninput="fieldChange(this)">`
                        }
                        <div class="fi-key">${f.id}</div>
                    </div>`;
                }).join('')}
            </div>`;
        body.appendChild(div);
    });
}

function toggleFg(el) {
    el.classList.toggle('open');
    el.classList.toggle('closed');
    el.querySelector('.fg-arr').textContent = el.classList.contains('closed') ? '▸' : '▾';
}

function collapseAll() {
    document.querySelectorAll('.fg').forEach(g => {
        g.classList.replace('open', 'closed');
        const a = g.querySelector('.fg-arr');
        if (a) a.textContent = '▸';
    });
}

function fieldChange(el) {
    vals[el.dataset.k] = el.value;
    // Image preview
    const next = el.nextElementSibling;
    if (next?.classList.contains('fi-img-preview')) {
        next.src = el.value;
        next.style.display = el.value ? 'block' : 'none';
    }
    dirty();
    clearTimeout(rlTimer);
    rlTimer = setTimeout(reload, 2200);
}

// ── Dirty / status ─────────────────────────────────────────────
function dirty() {
    isDirty = true;
    setStatus('dirty', 'Unsaved changes');
    document.getElementById('save-btn').disabled    = false;
    document.getElementById('discard-btn').disabled = false;
}

function setStatus(cls, txt) {
    const d = document.getElementById('sdot');
    d.className = 'sdot ' + cls;
    document.getElementById('status-txt').textContent = txt;
}

// ── Save ───────────────────────────────────────────────────────
async function save() {
    if (!curr) return;
    setStatus('saving', 'Saving...');
    document.getElementById('save-btn').disabled = true;

    const updates = {};
    // Only changed values
    Object.keys(vals).forEach(k => { if (vals[k] !== orig[k]) updates[k] = vals[k]; });
    const mt = document.getElementById('meta-title').value;
    const md = document.getElementById('meta-desc').value;
    if (mt !== (orig._meta_title ?? '')) updates._meta_title = mt;
    if (md !== (orig._meta_description ?? '')) updates._meta_description = md;

    if (!Object.keys(updates).length) {
        setStatus('saved', 'All changes saved'); isDirty = false;
        document.getElementById('discard-btn').disabled = true;
        return;
    }

    try {
        const res = await apiFetch('/api/site/page', {
            method: 'POST',
            body: JSON.stringify({ page: curr.file_name, values: updates }),
        });
        if (!res.success) throw new Error(res.error ?? 'Save failed');
        orig = { ...vals, _meta_title: mt, _meta_description: md };
        isDirty = false;
        setStatus('saved', 'All changes saved');
        document.getElementById('discard-btn').disabled = true;
        toast('Content saved', 'ok');
        setTimeout(reload, 600);
    } catch(e) {
        setStatus('dirty', 'Save failed — try again');
        document.getElementById('save-btn').disabled = false;
        toast(e.message || 'Save failed', 'err');
    }
}

function discard() {
    if (!confirm('Discard all unsaved changes?')) return;
    vals = { ...orig };
    isDirty = false;
    renderFields();
    document.getElementById('meta-title').value = orig._meta_title || '';
    document.getElementById('meta-desc').value  = orig._meta_description || '';
    setStatus('saved', 'All changes saved');
    document.getElementById('save-btn').disabled    = true;
    document.getElementById('discard-btn').disabled = true;
}

// ── Preview ────────────────────────────────────────────────────
function reload() {
    const f = document.getElementById('preview-frame');
    if (f.src && f.src !== 'about:blank') { const s = f.src; f.src = ''; f.src = s; }
}
function vp(size, btn) {
    document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const w = { desktop: '100%', tablet: '768px', mobile: '375px' }[size];
    document.getElementById('preview-frame').style.maxWidth = w;
}
function viewLive() { window.open(SITE + (curr?.path || '/'), '_blank'); }

// ── Nav list ───────────────────────────────────────────────────
function renderNav() {
    const list = document.getElementById('nav-list');
    const ps   = pages.length ? pages : [];
    if (!ps.length) {
        list.innerHTML = '<div style="padding:16px;font-size:12px;color:var(--text-muted)">No pages found</div>';
        return;
    }
    list.innerHTML = ps.map(p => {
        const id   = p.id || p.file_name;
        const name = p.name || p.display_name || id;
        const vis  = p.visible === 1 || p.visible === true;
        const isc  = curr && (curr.id === id || curr.file_name === id);
        return `
            <div class="np-row ${isc?'curr':''}" onclick="document.getElementById('page-select').value='${id}';loadPage('${id}')">
                <span class="np-name">${name}</span>
                <span class="np-vis ${vis?'on':''}">${vis?'Live':'Hidden'}</span>
            </div>`;
    }).join('');
}

async function scanPages() {
    toast('Scanning...');
    await fetchPages();
    renderNav();
    toast('Pages refreshed', 'ok');
}

// ── Agent Sam ──────────────────────────────────────────────────
async function agentSend() {
    const inp = document.getElementById('agent-input');
    const msg = inp.value.trim();
    if (!msg) return;
    inp.value = '';
    inp.disabled = true;
    document.getElementById('agent-send-btn').disabled = true;
    document.getElementById('agent-reply').textContent = 'Thinking...';

    const ctx = curr
        ? ` [Context: editing "${curr.display_name || curr.file_name}" (slug: ${(curr.path||'/').replace(/^\//,'')||'home'})]`
        : '';
    agentCtx.push({ role: 'user', content: msg + ctx });

    try {
        const res = await apiFetch('/api/ai/agent', {
            method: 'POST',
            body: JSON.stringify({
                message: msg + ctx,
                conversationId: null,
            }),
        });
        const reply = res.response || res.message || JSON.stringify(res);
        agentCtx.push({ role: 'assistant', content: reply });
        document.getElementById('agent-reply').textContent = reply.slice(0, 80) + (reply.length > 80 ? '...' : '');

        // Refresh fields if content was likely updated
        if (curr && /updated|changed|saved|edit/i.test(reply)) {
            setTimeout(() => loadPage(curr.id || curr.file_name), 1200);
        }
    } catch(e) {
        document.getElementById('agent-reply').textContent = 'Error: ' + e.message;
    } finally {
        inp.disabled = false;
        document.getElementById('agent-send-btn').disabled = false;
        inp.focus();
    }
}

// ── Helpers ────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
    const r = await fetch(API + path, {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
}

let toastT;
function toast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show' + (type ? ' ' + type : '');
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.className = ''; }, 2800);
}

function fadeOut(id) {
    const el = document.getElementById(id);
    if (el) { el.classList.add('out'); setTimeout(() => el.remove(), 400); }
}

function ucfirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function xh(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function xa(s) { return String(s ?? '').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
